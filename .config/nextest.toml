# cargo-nextest profiles for fs-forms (copied from fs-components 216594c0; workflow testlauf, CLAUDE.md §4: little but often).
# fs-forms has no test file named after socket/time/security/platform yet: nextest rejects a binary(...) operator that matches no binary, so those filters read test names (test(...)) here; switch back to binary(...) when such files exist.
#
# Run:  cargo nextest run -p <crate> --profile <quick|time|security|platform|picture|release> [--cargo-profile fast]
# Levels: `quick` while working on a finished module (seconds); `time` for the 10x rule (add --stress-count 10);
# `security` for the security modules; `platform` for Linux/Windows differences; `release` = everything (CI only).
#
# NAME CONVENTION (the filtersets below read it; a new test follows it so it lands in the right level):
#   picture   : test binary id (`<crate>::<file>`, matched with binary_id) contains `picture` or `theme` (every test of crate `fs-components-pictures`, tests/*picture*.rs, *_pictures.rs, theme.rs, style_theme.rs): drawn images and theme/style tests, own level `picture`, never in `quick`
#   time      : file name ends in `_time` / is `time.rs`, or the test uses sleep/Instant
#                 (*_typing_time.rs, time.rs, long_text, message_list_scroll, tooltip, view_requests, loading*)
#   socket    : file name contains `socket` / `pipe` / `worker` (real socket, named pipe, thread worker)
#   slow      : test NAME contains `every_component_draws`, `_over_<N>_` (..._over_1000_rebuilds), `thousand` (..._a_thousand_times) or `stress`; counts as `time`
#   security  : file name contains `human_only`, `safety`, `access`, the word `lock`/`locks`/`locked` (not `block`), or the test name contains `restricted` / `security`
#   platform  : file name contains `_unix` / `_windows`, or a `cfg(unix)` / `cfg(windows)` test; also files*/backup*/filepicker
#   everything else = unit / model test: level quick.
# Binary ids look like `<crate>::<test-file>` (unit tests: `<crate>`). test(/regex/) sees only the file name (or crate name), so what must see the crate uses binary_id(/regex/).

[profile.default]
fail-fast = false

# Level 1: unit and model tests only. No picture, timing, socket/worker, security or platform tests; stops at the first failure.
[profile.quick]
default-filter = "not (binary_id(/picture|theme/) | test(/_time$|^time$|::time$|tooltip|long_text|message_list_scroll|view_requests|loading|typing/) | test(/every_component_draws|_over_\\d+_|thousand|stress/) | test(/socket|pipe|worker|files_async|backup|stamp_unix|path_field/) | test(/human_only|safety|access|(^|_)lock(s|ed)?(_|$)/) | test(/restricted|security/))"
fail-fast = true
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

# Level 2: timing tests. The 10x rule: run with `--stress-count 10`; a flaky test is an error, so NO retries hide it.
[profile.time]
default-filter = "test(/_time$|^time$|::time$|tooltip|long_text|message_list_scroll|view_requests|loading|typing/) | test(/every_component_draws|_over_\\d+_|thousand|stress/)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

# Security modules: login, rights, crypto, sockets, "human only", sensitive and ai_* of fs-forms-core (additive: quick unchanged). Full run before a release (CLAUDE.md §4 hard limit 2).
[profile.security]
default-filter = "binary_id(/^fs-forms-core::(sensitive|ai_)/) | test(/human_only|safety|access|(^|_)lock(s|ed)?(_|$)/) | test(/restricted|security/)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

# Platform differences (Linux vs Windows): sockets/pipes, file stamps, workers, files.
[profile.platform]
default-filter = "test(/socket|pipe|worker|stamp_unix|stamp_windows|files|backup|path_field/)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

# Pictures and themes: drawn images, the four styles, theme tests (need a graphics adapter; software Vulkan on the runner).
[profile.picture]
default-filter = "binary_id(/picture|theme/)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

# Everything (release gate, CI): no filter, no retries, no fail-fast so the whole list of failures is seen.
[profile.release]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
