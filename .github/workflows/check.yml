# Runs fmt, clippy (pedantic), tests and the coding rules on every push (fs-release caller, pinned).
name: check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    uses: FreeSynergy-Net/fs-release/.github/workflows/check.yml@b71b39f61ffc812bb93e2dcf906ecf0bbb44bb2a
    with:
      # Software Vulkan (lavapipe) and fonts, as for the other programs with a window (the frontend builds on fs-components).
      software-gpu: true
