# Release of the library FreeSynergy Forms on a version tag (fs-release caller, pinned, LIBRARY MODE: no binary packages,
# the Pre-release carries the CHANGELOG.md section of the tag version; tag = workspace version = non-empty section).
# fs-forms builds no app binary: fs-starter is the one executable host and calls fs-forms-run as a library.
name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy/fs-release/.github/workflows/release.yml@v0.0.17
    with:
      kind: library
      name: fs-forms
