# Release of FreeSynergy Forms on a version tag (fs-release caller, pinned).
name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy/fs-release/.github/workflows/release.yml@v0.0.10
    with:
      # `fs-forms` holds the server (`fs-forms serve`) and the starter; `fs-forms-simple` is the frontend process.
      binaries: fs-forms,fs-forms-simple
      cargo-package: fs-forms-bin
      ignore-binaries: fs-forms-server
      name: fs-forms
      kind: app
      app-id: net.freesynergy.Forms
      macos: false
      windows-targets: ""   # Unix sockets and Unix paths for now
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
