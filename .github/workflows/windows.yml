# Windows gate for the whole workspace: clippy and tests on the Windows runner. The GPU/Blinc crates (the frontend builds on fs-components) are built too, and the tests that talk over a local socket (named pipe on Windows) run; there is no GPU adapter on the runner, so picture tests may be ignored there.
name: windows
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@e0aa772a12b91f8a37846b4efef5f44a963a6c47
        with:
          components: clippy
          cache-key: windows
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
      - run: cargo test --workspace --all-features --locked --no-fail-fast
        timeout-minutes: 15
