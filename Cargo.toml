[workspace]
resolver = "2"
members = [
    "crates/fs-forms-core",
    "crates/fs-forms-bind",
    "crates/fs-forms-layout",
    "crates/fs-forms-exchange",
    "crates/fs-forms-store",
    "crates/fs-forms-run",
    "crates/fs-forms-server",
    "crates/fs-forms-client",
    "crates/fs-layouts-rpc",
    "crates/fs-forms-simple",
]
# forms later runs as a blueprint package via fs-starter; fs-forms must not depend on fs-starter (cycle).
# The files of crates/fs-forms-bin stay, the crate is just not built here.
exclude = ["crates/fs-forms-bin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["FreeSynergy <support@freesynergy.net>"]
repository = "https://github.com/FreeSynergy/fs-forms"
# fs-rpc and fs-components need 1.89.
rust-version = "1.89"


# Development state only (ENTWURF-a5-schnitt section 4b, A5 F5): the new layouts types (Attr, Frame, PlaceNode, Block.set, Page.places)
# are read from the head of fs-interfaces branch unreviewed/a5-i1. Not tagged; replaced by the tag after the review of bundle 1.
[patch."https://github.com/FreeSynergy-Net/fs-interfaces"]
fs-interfaces = { git = "https://www.github.com/FreeSynergy-Net/fs-interfaces", rev = "60256ee02b2fffa1079a65175f8e5dd2a8e8ad72" }

# Development state only (ENTWURF-a5-schnitt section 4b, A5 F6): the catalog reads the places and the attribute vocabulary of the blocks
# (A5 C2). Head of fs-components branch unreviewed/a5-c2; only this crate (it depends on none of the other fs-components crates).
# Not tagged; replaced by the tag after the review of bundle 1. The "www." spelling is the way to a second source (see F5).
[patch."https://github.com/FreeSynergy-Net/fs-components"]
fs-components-catalog = { git = "https://www.github.com/FreeSynergy-Net/fs-components", rev = "8d52388ae8b0ce425fe93309f846cb70c571c12b" }
