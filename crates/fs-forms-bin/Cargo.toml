# EXCLUDED from the workspace (root Cargo.toml `exclude`): the files stay, the crate is not built, tested or released here.
# Its `fs-starter` pin below is a forbidden edge (fs-forms must not depend on fs-starter, ADR 0105): do NOT add this crate back
# to the workspace members without removing that pin first, or the cycle fs-starter -> fs-forms-run -> fs-forms returns.
# The one host is fs-starter; fs-forms is a library.

[package]
name = "fs-forms-bin"
description = "FreeSynergy Forms: one command for the program. Without words it makes sure the server runs and opens the frontend; `serve` runs the server."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fs-forms"
path = "src/main.rs"

[dependencies]
fs-forms-server = { path = "../fs-forms-server" }
fs-forms-client = { path = "../fs-forms-client" }
# No `fs-starter` pin here (forbidden edge, ADR 0105; fs-rpc has no such crate): the host is the repo fs-starter.
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "9cbce63c73045a2ea32b88038fd35732c4762624" }
# One source per library: the same tags as fs-rpc and the client.
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "2bb70d826681403894ec6d65a7fad9d3a3f51ac2" }
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290" }

# The frontend `simple` is a package of its own (one deb/rpm per Cargo package, ADR 0094 draft): the program needs it.
# Both binaries are never in ONE deb (file conflict with the deb of fs-forms-simple).
[package.metadata.deb]
name = "fs-forms"
# cargo-deb replaces only `$auto` in `depends`; so a fixed lower bound, not `${binary:Version}`.
depends = "$auto, fs-forms-simple (>= 0.0.11)"

# A package with its own generate-rpm table lists its assets itself (fs-release scripts/linux-pkg.sh).
[package.metadata.generate-rpm]
name = "fs-forms"
assets = [{ source = "target/release/fs-forms", dest = "/usr/bin/fs-forms", mode = "755" }]
[package.metadata.generate-rpm.requires]
fs-forms-simple = ">= 0.0.11"
