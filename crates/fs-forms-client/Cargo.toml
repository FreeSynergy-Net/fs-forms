[package]
name = "fs-forms-client"
description = "Client of the forms contract (surveys.capnp, draft 0.1): connects to fs-forms over a local socket and checks the contract version"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
semver = "1.0.28"
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "459c1e8d1226896cca53c3140f5aa912f43a5305", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "76df54074910e827ad556ff613335ada49c86de3", version = "0.3.0" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
fs-forms-server = { path = "../fs-forms-server", version = "0.1.0" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
