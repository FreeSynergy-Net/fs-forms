[package]
name = "fs-forms-client"
description = "Client of the forms contract (surveys.capnp, draft 0.1): connects to fs-forms over a local socket and checks the contract version"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
semver = "1.0.28"
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "9585ed181fc98db7e504272f451a10245dca7f1a", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "83b96e30ae3f8a04a222fa5a34dc4ad29306cdf2", version = "0.2.0" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
fs-forms-server = { path = "../fs-forms-server", version = "0.1.0" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
