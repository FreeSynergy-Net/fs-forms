[package]
name = "fs-forms-client"
description = "Client of the forms contract (surveys.capnp, draft 0.1): connects to fs-forms over a local socket and checks the contract version"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
semver = "1.0.28"
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "a773ceadb747ef6a0766b32983453e2b9855a8fd", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "4fcd013e60f8859ad70b203f2838d4b23912c1f4", version = "0.3.0" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
fs-forms-server = { path = "../fs-forms-server", version = "0.1.0" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
