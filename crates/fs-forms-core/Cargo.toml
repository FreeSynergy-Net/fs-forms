[package]
name = "fs-forms-core"
description = "Program core of FreeSynergy forms: surveys, anonymous ballots, results, widening over groups, decisions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fs-tally = { git = "https://github.com/FreeSynergy/fs-tally", tag = "v0.0.1" }
fs-ballot = { git = "https://github.com/FreeSynergy/fs-ballot", tag = "v0.0.1", features = ["serde"] }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", tag = "v0.0.10" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", tag = "v0.0.34" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["full"] }
