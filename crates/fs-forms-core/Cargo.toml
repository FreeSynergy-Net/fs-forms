[package]
name = "fs-forms-core"
description = "Program core of FreeSynergy forms: surveys, anonymous ballots, results, widening over groups, decisions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fs-tally = { git = "https://github.com/FreeSynergy-Net/fs-tally", tag = "v0.0.1", version = "0.0.1" }
fs-ballot = { git = "https://github.com/FreeSynergy-Net/fs-ballot", tag = "v0.0.1", features = ["serde"], version = "0.0.1" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "4fcd013e60f8859ad70b203f2838d4b23912c1f4", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
# `testing::owner()` / `testing::options()`: a store must have an owner before it takes a write (fs-objects 0.0.11).
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", features = ["testing"], version = "0.0.11" }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["full"] }
