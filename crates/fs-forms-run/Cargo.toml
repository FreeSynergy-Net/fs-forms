[package]
name = "fs-forms-run"
build = "build.rs"
description = "FreeSynergy Forms host (read only, first frame): connects to the layouts of fs-forms, takes the plan, lets the catalog choose and puts the window together from fs-components blocks only"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_forms_run"

# The process the starter runs (`fs:exec = fs-forms-run`, ADR 0094): never started by a person directly.
[[bin]]
name = "fs-forms-run"
path = "src/main.rs"

# H-K1: only the forms client and fs-components; no `fs-<program>-*`, no -core, no -server, no toml, no serde_json (a test reads
# `cargo tree`). The pins are the ones of `fs-forms-simple` (no pin changed). `fs-forms-bind` (probe H1, unpushed at the time of
# writing) joins when its crate is pinned: `view::View` is the narrow projection of its `Plan` until then.
[dependencies]
fs-forms-client = { path = "../fs-forms-client", version = "0.1.0" }
fs-forms-layout = { path = "../fs-forms-layout", version = "0.1.0" }
fs-forms-exchange = { path = "../fs-forms-exchange", version = "0.1.0" }
fs-components = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9cea35b045d3fff994358b2c118d693f0cf20246", features = ["views"], version = "0.1.0" }
fs-components-app = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9cea35b045d3fff994358b2c118d693f0cf20246", features = ["play"], version = "0.1.0" }
fs-components-widgets = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9cea35b045d3fff994358b2c118d693f0cf20246", version = "0.1.0" }
fs-components-mf2 = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9cea35b045d3fff994358b2c118d693f0cf20246", version = "0.1.0" }
fs-components-kanban = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9cea35b045d3fff994358b2c118d693f0cf20246", version = "0.1.0" }
fs-components-fields = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9cea35b045d3fff994358b2c118d693f0cf20246", version = "0.1.0" }
fs-components-styles = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9cea35b045d3fff994358b2c118d693f0cf20246", version = "0.1.0" }
fs-components-words = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9cea35b045d3fff994358b2c118d693f0cf20246", version = "0.1.0" }
# What the blocks of the contract are (and what they accept and render): the host asks it, it has no table of its own.
fs-components-catalog = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9cea35b045d3fff994358b2c118d693f0cf20246", version = "0.1.0" }
fs-components-core = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9cea35b045d3fff994358b2c118d693f0cf20246", version = "0.1.0" }
# The people workbench (widget of the block `contact-row`; `fs-components-widgets` does not hold it): one dependency, nothing copied.
fs-components-workbenches = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9cea35b045d3fff994358b2c118d693f0cf20246", version = "0.1.0" }

# The form catalog (`fs_interfaces::forms`, forms.txt) and the one form match (`fs-forms-bind`): the host holds no table of forms.
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", tag = "v0.1.0", version = "0.1.0" }
# `InterfaceVersion` (V-1, fs-types v0.0.6, the same tag as fs-components): the one reader of "name@x.y.z"; the block catalog answers `draws(&InterfaceVersion)`.
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", tag = "v0.0.6", version = "0.0.5" }
fs-forms-bind = { path = "../fs-forms-bind", version = "0.1.0" }
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", tag = "v0.1.3", version = "0.1.3" }
# `UndoState` (the depth of the undo of one actor) for `Records::history`: one type, no copy. The rev is the one of S3-3 (v0.0.11); only the type is used.
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "f6409f2a5378ba1464e69ae216efd4d27d249182", version = "0.0.11" }
tokio = { version = "1", features = ["rt", "sync", "net", "time"] }

# Picture tests (the window drawn without a window, read back): the same dev-dependencies as fs-forms-simple.
[dev-dependencies]
tempfile = "3"
png = "0.18"
