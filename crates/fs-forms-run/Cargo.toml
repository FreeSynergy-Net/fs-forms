[package]
name = "fs-forms-run"
build = "build.rs"
description = "FreeSynergy Forms host (read only, first frame): connects to the layouts of fs-forms, takes the plan, lets the catalog choose and puts the window together from fs-components blocks only"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_forms_run"

# The process the starter runs (`fs:exec = fs-forms-run`, ADR 0094): never started by a person directly.
[[bin]]
name = "fs-forms-run"
path = "src/main.rs"

# H-K1: only the forms client and fs-components; no `fs-<program>-*`, no -core, no -server, no toml, no serde_json (a test reads
# `cargo tree`). The pins are the ones of `fs-forms-simple` (no pin changed). `fs-forms-bind` (probe H1, unpushed at the time of
# writing) joins when its crate is pinned: `view::View` is the narrow projection of its `Plan` until then.
[dependencies]
fs-forms-client = { path = "../fs-forms-client", version = "0.1.0" }
fs-forms-layout = { path = "../fs-forms-layout", version = "0.1.0" }
fs-forms-exchange = { path = "../fs-forms-exchange", version = "0.1.0" }
fs-components = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", features = ["views"], version = "0.1.0" }
fs-components-app = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", features = ["play"], version = "0.1.0" }
fs-components-widgets = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", version = "0.1.0" }
fs-components-mf2 = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", version = "0.1.0" }
fs-components-kanban = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", version = "0.1.0" }
fs-components-fields = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", version = "0.1.0" }
fs-components-styles = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", version = "0.1.0" }
fs-components-words = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", version = "0.1.0" }
# What the blocks of the contract are (and what they accept and render): the host asks it, it has no table of its own.
fs-components-catalog = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", version = "0.1.0" }
# The command `layout.frontend` and the lines of the frontends as data (C0): the menu `View` is made of its rows, no list of our own.
fs-components-commands = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", version = "0.1.0" }
fs-components-core = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", version = "0.1.0" }
# The people workbench (widget of the block `contact-row`; `fs-components-widgets` does not hold it): one dependency, nothing copied.
fs-components-workbenches = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", version = "0.1.0" }

# The question the host asks when a place is open with another record (`Notification::ask`, ADR 0106): the one existing facade, no own dialog.
fs-notification = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "4a923bbc843f07534376213a04ee9e2806070611", version = "0.1.0" }

# The form catalog (`fs_interfaces::forms`, forms.txt) and the one form match (`fs-forms-bind`): the host holds no table of forms.
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "92dbb53e9c9ea2c48e85a27712f0456f2a7b8161", version = "0.3.0" }
# `InterfaceVersion` (V-1, fs-types rev 722d3ce0 = v0.0.7, the same rev as fs-components): the one reader of "name@x.y.z"; the block catalog answers `draws(&InterfaceVersion)`.
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
fs-forms-bind = { path = "../fs-forms-bind", version = "0.1.0" }
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "bfcb9d374a09489bac2d08b077ba81d51d47785c", version = "0.1.4" }
# `UndoState` (the depth of the undo of one actor) for `Records::history`: one type, no copy. The rev is the one of S3-3 (v0.0.11); only the type is used.
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
tokio = { version = "1", features = ["rt", "sync", "net", "time"] }
# The scope of a record inside a `WindowId` (RFC 3986 percent-encoding; no encoder of our own).
percent-encoding = "2.3"
# "now" of a view: `Moment` is an instant in UTC; the real clock is `SystemTime` (no `clock` feature, no second zone reader), the parser is for `--sample-now`.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Picture tests (the window drawn without a window, read back): the same dev-dependencies as fs-forms-simple.
[dev-dependencies]
tempfile = "3"
png = "0.18"
proptest = "1"
# The probe of the consumer path (`src/sample_probe.rs`): the test data of a description, derived with the real catalog adapter. No cycle:
# testdata depends on bind and layout only.
fs-forms-testdata = { path = "../fs-forms-testdata", version = "0.1.0" }
# The test data of the board tests (`tests/sample_source`): `SampleModule` answers in process; its rights come from the `fake` owner.
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "92dbb53e9c9ea2c48e85a27712f0456f2a7b8161", version = "0.3.0", features = ["fake"] }
