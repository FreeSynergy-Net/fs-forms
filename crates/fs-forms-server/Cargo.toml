[package]
name = "fs-forms-server"
description = "Cap'n Proto server of FreeSynergy Forms: the contract surveys.capnp (draft 0.1) over a local socket; today it answers what it offers, and nothing more"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# One source per library: the same tags as fs-rpc (it pins fs-types, fs-interfaces and fs-objects by tag itself).
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "e3871c3b2438fae23fdc1eb6c72dd7c125f21abd", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "6b02b138b3e55c290d6cbd957976013cc49dca5d", version = "0.3.0" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt"] }
