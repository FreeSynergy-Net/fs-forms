[package]
name = "fs-forms-server"
description = "Cap'n Proto server of FreeSynergy Forms: the contract surveys.capnp (draft 0.1) over a local socket; today it answers what it offers, and nothing more"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# One source per library: the same tags as fs-rpc (it pins fs-types, fs-interfaces and fs-objects by tag itself).
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "63e3a4860b09c77a04e950d1451c85da0198a4ef", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "4fcd013e60f8859ad70b203f2838d4b23912c1f4", version = "0.3.0" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt"] }
