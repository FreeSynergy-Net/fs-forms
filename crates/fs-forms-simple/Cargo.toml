[package]
name = "fs-forms-simple"
description = "The standard frontend `simple` of FreeSynergy Forms: a window on fs-components that talks to the server only through the client crate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_forms_simple"

# The process the starter `fs-forms` runs (ADR 0094 draft, item 6): never started by a person directly.
[[bin]]
name = "fs-forms-simple"
path = "src/main.rs"

[dependencies]
# ONLY the client and fs-components (ADR 0094 draft, item 6): never -core and never -server (a test checks `cargo tree`).
fs-forms-client = { path = "../fs-forms-client" }
# One revision of fs-components (pinned by rev until the bundled release returns it to a tag) for everything; Blinc comes only through it (`fs_components::blinc`), never as a dependency here.
fs-components = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "fb0a9d29591349b9626fb1b61325f14974cb5550" }
fs-components-app = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "fb0a9d29591349b9626fb1b61325f14974cb5550" }
fs-components-widgets = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "fb0a9d29591349b9626fb1b61325f14974cb5550" }
fs-components-mf2 = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "fb0a9d29591349b9626fb1b61325f14974cb5550" }
fs-components-words = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "fb0a9d29591349b9626fb1b61325f14974cb5550" }


# The manifest of the frontend goes where the starter looks (`<XDG_DATA_DIRS>/freesynergy/frontends/<program>/<id>.metainfo.xml`):
# without it the starter finds no frontend after an installation and says `frontend-missing`. The test `tests/packaging.rs` of this crate reads these lines.
# OPEN (decision, check report F1): this crate and its `fs:exec fs-forms-simple` vs `fs-forms-run` of the manifests made by fs-blueprint; see CHANGELOG, section 0.0.8 (Known/Open).
[package.metadata.deb]
assets = [
    ["target/release/fs-forms-simple", "usr/bin/", "755"],
    ["../../packaging/frontends/simple.metainfo.xml", "usr/share/freesynergy/frontends/forms/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/fs-forms-simple", dest = "/usr/bin/fs-forms-simple", mode = "755" },
    { source = "packaging/frontends/simple.metainfo.xml", dest = "/usr/share/freesynergy/frontends/forms/simple.metainfo.xml", mode = "644" },
]

[dev-dependencies]
# The real server, started inside the tests only (a dev-dependency: `cargo tree -e normal` shows no way to -server).
fs-forms-server = { path = "../fs-forms-server" }
tempfile = "3"
png = "0.18"
