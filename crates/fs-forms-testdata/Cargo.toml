[package]
name = "fs-forms-testdata"
description = "FreeSynergy Forms: generic, deterministic test data made from the declaration of a form (builder, strategies per channel kind, AS2 objects with JSCalendar content)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Same pins as the rest of the workspace (fs-interfaces 4f6c3281, fs-types 722d3ce0, fs-objects e38093f1, fs-components 508a25f3);
# fs-jscalendar 0a3add97 is the rev fs-tasks-testdata pins together with fs-types 722d3ce0 (one fs-types in the graph).
[dependencies]
fs-forms-bind = { path = "../fs-forms-bind", version = "0.1.0" }
# The description (Layout) and its blocks: the port `BlockForms` is ours, the block catalog (fs-components) stays on the host side (Entscheid C1/C2 Q1).
fs-forms-layout = { path = "../fs-forms-layout", version = "0.1.0" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "4f6c3281cab594a76640c50abaedb4f7c4e79d97", version = "0.3.0" }
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
fs-jscalendar = { git = "https://github.com/FreeSynergy-Net/fs-jscalendar", rev = "0a3add97339c92be0ab8b524a294ca44ee8dca25", version = "0.0.7" }
# Text fillers (titles, words): no word lists of our own. Pinned EXACTLY: the lists change between versions, the golden test
# then has to be renewed on purpose. 5.1.0 (MIT OR Apache-2.0) uses rand 0.10, the rand already in the graph.
fake = { version = "=5.1.0", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "chacha"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `[sample]` of a description: strict (deny_unknown_fields). Already in the graph (toml 0.8, via other crates); parse only.
toml = { version = "0.8", default-features = false, features = ["parse"] }
uuid = "1"

# The conformance suite of module_v1 runs against `SampleModule` behind the wrapper `fs_rpc::Guarded` (in-process, no socket). fs-module lives in the
# repo fs-interfaces: the same rev as the `fs-interfaces` above, so there is ONE fs-interfaces in the graph (checked with `cargo tree -d`).
[dev-dependencies]
# Tests read the real descriptions with the exchange reader.
fs-forms-exchange = { path = "../fs-forms-exchange", version = "0.1.0" }
fs-module = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "4f6c3281cab594a76640c50abaedb4f7c4e79d97", version = "0.3.0" }
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "b279f4285da84110f36a5e62a17262b7aab2b2d4", version = "0.1.4" }
capnp = "0.27"
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "4f6c3281cab594a76640c50abaedb4f7c4e79d97", version = "0.3.0", features = ["fake"] }
tokio = { version = "1", features = ["rt", "macros"] }
