[package]
name = "fs-layouts-rpc"
description = "FreeSynergy layouts over RPC: the client RpcLayouts (the ports LayoutRead, LayoutWrite, PackageLayouts and OverlayWrite over the contract layouts), the server skeleton LayoutService (the contract over any port) and ensure_service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# One source per library: the same tags as fs-forms-server (fs-rpc pins fs-types, fs-interfaces and fs-objects by tag itself).
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "4f023428fab11b0343d44638fcc36671f642acd6", version = "0.1.3" }
fs-forms-layout = { path = "../fs-forms-layout", version = "0.1.0" }
# The contracts `common`, `layouts` and `bind` (schemas and generated code) come from fs-interfaces v0.0.32.
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "12142143f49f9a60acbbd994659a57e5e6bdc536", version = "0.1.1" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }
futures = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "rt-multi-thread"] }
