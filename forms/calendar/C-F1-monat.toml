# forms description of the calendar frontend "calendar-month" (C5 draft 25.11.2026, checked and corrected by C2 25.11.2026, workflow frontend-round step check). IMPORT FORM ONLY (ADR 0096 point 6), Format 4.
# Source: contract events, type Event (JSCalendar Event, ADR 0085): appointments are the area of the events module, tasks come as a second source later (C-F5, C-F6).
# The block `calendar-grid` binds the form `bars-in-time@^1.1.0` itself (contract `forms=`, slots `items`/`start`/`end`/`label`/`all-day`/`lane`/`color`): the place `source = 1` is all this file says, the rows come as records of the events provider (the host has no binding to write, as with `task-row`). The events module serves no form for it yet, so the data of the picture are the fixed events of `[sample]`.
# Commands are the contract keys of events (fs-events): event.create, event.update, event.delete. A key that no module serves keeps its control locked ("coming").
# Menus follow the model (GNOME Calendar 47, dossier kalender/vorbilder/DOSSIER-A): what has no contract command yet is NOT written here (cards in BERICHT-kalender-frontends-check.md).
# The switch between month, week, agenda and timeline is the frontend switch of the host (as in fs-tasks/forms/README.md, M-004..M-006); the menu "View" lists the view of this description.
schema = 4
kind = "frontend"
id = "calendar-month"
extends = "net.freesynergy.Calendar"
exec = "fs-forms-run"
title = "calendar-month-title"
style = "default"

[[requires]]
elem = "requires:1"
contract = "events@>=0.0.1, <0.1.0"

# Source 1 = the events provider. "all" = every appointment; the time window is a scope parameter of the source (forms.txt "Range ... NOT a channel"; the module expands series).
[[source]]
elem = "source:1"
n = 1
contract = "events@>=0.0.1, <0.1.0"
type = "Event"
scope = "all"

[[menu]]
elem = "menu:0"
kind = "standard-program"

[[menu]]
elem = "menu:1"
kind = "menu"
label = "menu-event"

[[menu.entries]]
elem = "menu:1.0"
kind = "command"
label = "menu-new"
source = 1
command = "event.create"
key = "ctrl+n"

[[menu]]
elem = "menu:2"
kind = "menu"
label = "menu-view"

[[menu.entries]]
elem = "menu:2.0"
kind = "view"
label = "view-month"
view = "month"
key = "alt+1"

[[menu]]
elem = "menu:9"
kind = "standard-help"

# C-F1 Month: the month grid with event blocks (colour bar, title, time), "+N" overflow, mini calendar in the side strip (calendar-grid, place option `view=month`), Today and month navigation are parts of calendar-grid (`toolbar`).
# Data: appointments (start, duration, whole-day flag) as blocks; colour from `color` of bars-in-time@1.1.0. The switch month/week is the view menu and the frontend switch, not a block (see card segmented).
[[page]]
elem = "page:month"
page = "month"
frame = "workbench"
navigation = "single"

[[page.place]]
elem = "block:month/mini"
at = "side"
block = "calendar-grid"
source = 1
set = { view = "month" }

[[page.place]]
elem = "block:month/main"
at = "main"
block = "calendar-grid"
source = 1
set = { view = "month" }

[[page.place]]
elem = "block:month/empty"
at = "empty"
block = "empty-state"
title = "calendar-empty-title"
text = "calendar-empty-text"

[[page.place]]
elem = "block:month/partial"
at = "partial"
block = "partial-notice"

[[action]]
elem = "action:1"
at = "block:month/main"
trigger = "quick-add"
source = 1
command = "event.create"

[[view]]
elem = "view:month"
view = "month"

[[message]]
elem = "message:calendar-month-title/de"
key = "calendar-month-title"
lang = "de"
text = "FreeSynergy Kalender: Monat"

[[message]]
elem = "message:calendar-month-title/en"
key = "calendar-month-title"
lang = "en"
text = "FreeSynergy Calendar: month"

[[message]]
elem = "message:menu-event/de"
key = "menu-event"
lang = "de"
text = "Termin"

[[message]]
elem = "message:menu-event/en"
key = "menu-event"
lang = "en"
text = "Event"

[[message]]
elem = "message:menu-new/de"
key = "menu-new"
lang = "de"
text = "Neu"

[[message]]
elem = "message:menu-new/en"
key = "menu-new"
lang = "en"
text = "New"

[[message]]
elem = "message:menu-view/de"
key = "menu-view"
lang = "de"
text = "Ansicht"

[[message]]
elem = "message:menu-view/en"
key = "menu-view"
lang = "en"
text = "View"

[[message]]
elem = "message:view-month/de"
key = "view-month"
lang = "de"
text = "Monat"

[[message]]
elem = "message:view-month/en"
key = "view-month"
lang = "en"
text = "Month"

[[message]]
elem = "message:calendar-empty-title/de"
key = "calendar-empty-title"
lang = "de"
text = "Keine Termine"

[[message]]
elem = "message:calendar-empty-title/en"
key = "calendar-empty-title"
lang = "en"
text = "No events"

[[message]]
elem = "message:calendar-empty-text/de"
key = "calendar-empty-text"
lang = "de"
text = "Lege einen an mit Termin, Neu."

[[message]]
elem = "message:calendar-empty-text/en"
key = "calendar-empty-text"
lang = "en"
text = "Create one with Event, New."



# Sample data for pictures and development (--sample-data), never real entries and never written out: the fixed events of the sample of the contract events (fixed source `events.sample`), for the month of the picture (2026-11). No count, no seed: the data are the same on every run.
[sample]
anchor = { month = "2026-11", zone = "Europe/Berlin" }

[[sample.set]]
source = 1
form = "bars-in-time@^1.1.0"
type = "Event"
fixed = "events.sample"
