# forms description of the calendar frontend "calendar-week" (C5 draft 25.11.2026, checked and corrected by C2 25.11.2026, workflow frontend-round step check). IMPORT FORM ONLY (ADR 0096 point 6), Format 4.
# Source: contract events, type Event (JSCalendar Event, ADR 0085): appointments are the area of the events module, tasks come as a second source later (C-F5, C-F6). The events module serves NO form for time views yet, so every block of
# this file is placed WITHOUT bindings and the host shows "not built yet" for it. The block `calendar-grid` has slots and the form `bars-in-time@^1.1.0` in the contract, but this description does not bind them yet (the binding comes with the job "calendar frontends"); `timeline` has forms=["bars-in-time@^1.0.0"].
# Commands are the contract keys of events (fs-events): event.create, event.update, event.delete. A key that no module serves keeps its control locked ("coming").
# Menus follow the model (GNOME Calendar 47, dossier kalender/vorbilder/DOSSIER-A): what has no contract command yet is NOT written here (cards in BERICHT-kalender-frontends-check.md).
# The switch between month, week, agenda and timeline is the frontend switch of the host (as in fs-tasks/forms/README.md, M-004..M-006); the menu "View" lists the view of this description.
schema = 4
kind = "frontend"
id = "calendar-week"
extends = "net.freesynergy.Calendar"
exec = "fs-forms-run"
title = "calendar-week-title"
style = "default"

[[requires]]
elem = "requires:1"
contract = "events@>=0.0.1, <0.1.0"

# Source 1 = the events provider. "all" = every appointment; the time window is a scope parameter of the source (forms.txt "Range ... NOT a channel"; the module expands series).
[[source]]
elem = "source:1"
n = 1
contract = "events@>=0.0.1, <0.1.0"
type = "Event"
scope = "all"

[[menu]]
elem = "menu:0"
kind = "standard-program"

[[menu]]
elem = "menu:1"
kind = "menu"
label = "menu-event"

[[menu.entries]]
elem = "menu:1.0"
kind = "command"
label = "menu-new"
source = 1
command = "event.create"
key = "ctrl+n"

[[menu]]
elem = "menu:2"
kind = "menu"
label = "menu-view"

[[menu.entries]]
elem = "menu:2.0"
kind = "view"
label = "view-week"
view = "week"
key = "alt+2"

[[menu]]
elem = "menu:9"
kind = "standard-help"

# C-F2 Week: time axis (hours, parts `gutter`/`hour`), columns per day, all-day row, now line (calendar-grid, place option `view=week`); dragging an entry moves it.
# drop = event.update (contract key of events). The events module serves it NOT yet as a form command and the channel map of a move in bars-in-time is the module's, not this file's: the control stays locked ("coming"). Card C3.
[[page]]
elem = "page:week"
page = "week"
frame = "workbench"
navigation = "single"

[[page.place]]
elem = "block:week/main"
at = "main"
block = "calendar-grid"
source = 1
set = { view = "week" }

[[page.place]]
elem = "block:week/partial"
at = "partial"
block = "partial-notice"

[[action]]
elem = "action:1"
at = "block:week/main"
trigger = "drop"
source = 1
command = "event.update"

[[action]]
elem = "action:2"
at = "block:week/main"
trigger = "quick-add"
source = 1
command = "event.create"

[[view]]
elem = "view:week"
view = "week"

[[message]]
elem = "message:calendar-week-title/de"
key = "calendar-week-title"
lang = "de"
text = "FreeSynergy Kalender: Woche"

[[message]]
elem = "message:calendar-week-title/en"
key = "calendar-week-title"
lang = "en"
text = "FreeSynergy Calendar: week"

[[message]]
elem = "message:menu-event/de"
key = "menu-event"
lang = "de"
text = "Termin"

[[message]]
elem = "message:menu-event/en"
key = "menu-event"
lang = "en"
text = "Event"

[[message]]
elem = "message:menu-new/de"
key = "menu-new"
lang = "de"
text = "Neu"

[[message]]
elem = "message:menu-new/en"
key = "menu-new"
lang = "en"
text = "New"

[[message]]
elem = "message:menu-view/de"
key = "menu-view"
lang = "de"
text = "Ansicht"

[[message]]
elem = "message:menu-view/en"
key = "menu-view"
lang = "en"
text = "View"

[[message]]
elem = "message:view-week/de"
key = "view-week"
lang = "de"
text = "Woche"

[[message]]
elem = "message:view-week/en"
key = "view-week"
lang = "en"
text = "Week"



# Sample data for pictures and development (--sample-data), never real entries and never written out: the fixed events of the sample of the contract events (fixed source `events.sample`), for the week of the picture (2026-W47, 16 to 22 November). No count, no seed: the data are the same on every run.
[sample]
anchor = { week = "2026-W47", zone = "Europe/Berlin" }

[[sample.set]]
source = 1
form = "bars-in-time@^1.1.0"
type = "Event"
fixed = "events.sample"
