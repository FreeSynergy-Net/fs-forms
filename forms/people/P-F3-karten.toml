# forms description of the people frontend "people-cards" (cards). IMPORT FORM ONLY (ADR 0096 point 6), Format 4.
# Draft of C5 25.11.2026 (Merkuro Contact as the model), corrected and built by C2 26.11.2026 (workflow frontend-round, step build) after the check
# against the real block catalog (fs-forms-run tests/people_descriptions.rs): no block on a place that does not take it, one child in `main`.
# Source: the directory of persons (capability `people.persons`, contract `person_directory_v1`), type Person. ONE person = ONE record (the real account;
# a written-down contact is only a profile of it): the sample `person-directory.sample` (fixed source of fs-forms-testdata, AS2 object with a
# JSContact RFC 9553 card as content) gives people with several e-mails and phones and a postal address, with their display names, never an identifier.
# No module serves these forms yet (forms.txt: `planned`); the fixture is the provider (`fake`). Commands: none is written here, because no service
# serves `person.*` (capabilities.txt has only the keys of the topics); what the model can do (new, delete, export) comes as cards, never as an invented command.
# Birthday and photo as a field are missing in the directory excerpt (`ExcerptField`): not invented, card to C3 in BERICHT-people-frontends.md.
# The four people frontends show DIFFERENT data of the same module: P-F1 rows@1.0.0 (table: name + the short fields), P-F2 single-record@1.2.0 (all contact fields of one person), P-F3 tiles@1.1.0 (cards), P-F4 rows@1.0.0 (contacts workbench: the list of faces and names, and the sheet of the chosen person).
# STATE 26.11.2026 (host on fs-components 4a923bbc): the block `tile-grid` is drawn (widget `TileGrid`, view of tiles@^1.1.0): one tile per person with the face (initials until a photo is a picture), the name and the facts (e-mail, phone, address, surname) each under its own label; two values of one field are two lines under ONE label, a field without a value shifts nothing. Tiles wrap at the minimum width. A click on a tile has no command yet (card to C4: `open` and `actions` of tiles@1.1.0). Same people, other data of the module than P-F1 and P-F2.
schema = 4
kind = "frontend"
id = "people-cards"
extends = "net.freesynergy.People"
exec = "fs-forms-run"
title = "people-cards-title"
style = "default"

[[requires]]
elem = "requires:1"
contract = "people.persons@>=0.0.1, <0.1.0"

[[source]]
elem = "source:1"
n = 1
contract = "people.persons@>=0.0.1, <0.1.0"
type = "Person"
scope = "all"

[[menu]]
elem = "menu:0"
kind = "standard-program"

[[menu]]
elem = "menu:1"
kind = "menu"
label = "menu-view"

[[menu.entries]]
elem = "menu:1.0"
kind = "view"
label = "view-cards"
view = "cards"

[[menu]]
elem = "menu:9"
kind = "standard-help"

# Merkuro Contact (grid of contact cards): one tile per person: photo (reference), name, three facts (e-mail, phone, address). The editor of the draft (P-F3, Merkuro contact_editor) needs a service that serves `person.update`: none does, so it is a card, not a description.
[[page]]
elem = "page:cards"
page = "cards"
frame = "workbench"
navigation = "single"

[[page.place]]
elem = "block:cards/main"
at = "main"
block = "tile-grid"
source = 1

[[view]]
elem = "view:cards"
view = "cards"

# Sample data for pictures and development (--sample-data), never real entries and never written out: the fixed people of the sample of the
# contract `person_directory_v1` (fixed source `person-directory.sample`). No count, no seed: the data are the same on every run.
[sample]
anchor = { month = "2026-11", zone = "Europe/Berlin" }

[[sample.set]]
source = 1
form = "tiles@^1.1.0"
type = "Person"
fixed = "person-directory.sample"

[[message]]
elem = "message:people-cards-title/de"
key = "people-cards-title"
lang = "de"
text = "FreeSynergy Personen: Karten"

[[message]]
elem = "message:people-cards-title/en"
key = "people-cards-title"
lang = "en"
text = "FreeSynergy People: cards"

[[message]]
elem = "message:menu-view/de"
key = "menu-view"
lang = "de"
text = "Ansicht"

[[message]]
elem = "message:menu-view/en"
key = "menu-view"
lang = "en"
text = "View"

[[message]]
elem = "message:view-cards/de"
key = "view-cards"
lang = "de"
text = "Karten"

[[message]]
elem = "message:view-cards/en"
key = "view-cards"
lang = "en"
text = "Cards"
